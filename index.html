<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>คลังวิดีโอประวัติศาสตร์และบุคคลสำคัญ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent-gold: #d4af37;
            --bg-dark: #1a1a1a;
            --text-main: #f4e4bc;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 2px 2px, rgba(212, 175, 55, 0.02) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .gold-gradient {
            background: linear-gradient(180deg, #f4e4bc 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .video-card {
            flex: 0 0 calc(50% - 0.5rem); 
            max-width: 300px;
        }

        @media (max-width: 640px) {
            .video-card {
                flex: 0 0 calc(70% - 0.5rem);
            }
        }

        #video-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #video-overlay.active { display: flex; }

        .video-container {
            width: 95%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .active-nav {
            color: var(--accent-gold) !important;
            border-top: 2px solid var(--accent-gold);
        }

        .section-card-bg {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }

        #sidebar {
            transition: transform 0.3s ease-in-out;
            z-index: 100;
        }
        .sidebar-closed {
            transform: translateX(-100%);
        }
    </style>
</head>
<body class="pb-24">

    <!-- Sidebar Menu -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#151515] border-r border-[#d4af37]/30 sidebar-closed overflow-y-auto custom-scroll">
        <div class="p-6 border-b border-[#d4af37]/20 flex justify-between items-center">
            <h2 class="text-lg font-bold text-[#d4af37] font-[Cinzel]">เมนูหมวดหมู่</h2>
            <button onclick="toggleSidebar()" class="text-[#d4af37] text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="p-4 space-y-6">
            <!-- หมวดหมู่บุคคล -->
            <div>
                <button onclick="toggleCollapse('menu-hist')" class="w-full flex justify-between items-center text-[#f4e4bc] font-bold mb-2 pb-1 border-b border-white/10">
                    <span>หมวดหมู่บุคคล</span>
                    <i id="hist-icon" class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menu-hist" class="space-y-1 pl-2 overflow-hidden transition-all">
                    <div id="hist-cat-list" class="flex flex-col gap-1 text-xs"></div>
                </div>
            </div>

            <!-- หมวดหมู่ประวัติศาสตร์โลก -->
            <div>
                <button onclick="toggleCollapse('menu-world')" class="w-full flex justify-between items-center text-[#f4e4bc] font-bold mb-2 pb-1 border-b border-white/10">
                    <span>หมวดหมู่ประวัติศาสตร์โลก</span>
                    <i id="world-icon" class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="menu-world" class="space-y-1 pl-2 overflow-hidden transition-all">
                    <div id="world-cat-list" class="flex flex-col gap-1 text-xs"></div>
                </div>
            </div>

            <!-- นโยบายส่วนตัว -->
            <div class="pt-4 border-t border-white/10">
                <a href="https://sites.google.com/view/privacy-policy-pdpa-crow-studi/%E0%B8%AB%E0%B8%99%E0%B8%B2%E0%B9%81%E0%B8%A3%E0%B8%81" target="_blank" class="w-full flex items-center gap-3 text-gray-400 hover:text-[#d4af37] text-sm py-2 px-3 transition-all group">
                    <i class="fa-solid fa-shield-halved text-[#d4af37]/60 group-hover:text-[#d4af37]"></i>
                    <span>นโยบายส่วนตัว</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-[90] hidden"></div>

    <!-- Header -->
    <header class="p-4 md:p-6 border-b border-[#d4af37]/20 sticky top-0 bg-[#151515]/90 backdrop-blur-md z-40">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto">
                <button onclick="toggleSidebar()" class="text-[#d4af37] text-xl p-2 hover:bg-white/5 rounded-full">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="text-left">
                    <h1 class="text-xl md:text-3xl font-bold gold-gradient font-[Cinzel] tracking-widest uppercase">
                        Historical Archive
                    </h1>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-72">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="ค้นหาตามชื่อ/หมวดหมู่..." class="w-full bg-[#252525] border border-[#d4af37]/30 rounded-full py-2 px-4 pl-10 text-[#f4e4bc] focus:outline-none focus:border-[#d4af37] transition-all text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-[#d4af37]/60 text-xs"></i>
            </div>
        </div>
    </header>

    <main id="main-content" class="p-4 max-w-6xl mx-auto min-h-[60vh]">
        <div id="filter-status" class="mb-6 flex flex-wrap items-center gap-2 text-xs text-[#d4af37]/70">
            <span id="view-label" class="bg-[#d4af37]/10 px-3 py-1 rounded-full border border-[#d4af37]/20">หน้าแรก: ทั้งหมด</span>
        </div>

        <div id="loader" class="flex flex-col items-center justify-center py-20 text-[#d4af37]">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i>
            <p id="loader-text">กำลังดึงข้อมูลจากจดหมายเหตุ...</p>
        </div>

        <div id="sections-wrapper" class="space-y-12"></div>
    </main>

    <footer class="p-8 text-center text-gray-500 text-xs border-t border-white/5">
        <p class="mb-2">Powered by <span class="text-red-500 font-bold"><i class="fa-brands fa-youtube mr-1"></i>YouTube</span></p>
        <p>&copy; 2024 Historical Video Archive. All rights reserved.</p>
    </footer>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 w-full bg-[#1a1a1a]/95 border-t border-[#d4af37]/30 flex justify-around items-center z-50 backdrop-blur-md">
        <button onclick="changeView('all')" id="nav-all" class="flex flex-col items-center justify-center w-full py-4 text-gray-500 transition-all group">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[10px]">ทั้งหมด</span>
        </button>
        <button onclick="changeView('บุคคล')" id="nav-history" class="flex flex-col items-center justify-center w-full py-4 text-gray-500 transition-all group">
            <i class="fa-solid fa-users text-xl mb-1"></i>
            <span class="text-[10px]">บุคคล</span>
        </button>
        <button onclick="changeView('โลก')" id="nav-world" class="flex flex-col items-center justify-center w-full py-4 text-gray-500 transition-all group">
            <i class="fa-solid fa-earth-asia text-xl mb-1"></i>
            <span class="text-[10px]">ประวัติศาสตร์โลก</span>
        </button>
        <button onclick="changeView('favorite')" id="nav-fav" class="flex flex-col items-center justify-center w-full py-4 text-gray-500 transition-all group">
            <i class="fa-solid fa-star text-xl mb-1"></i>
            <span class="text-[10px]">รายการโปรด</span>
        </button>
    </nav>

    <!-- Video Player Overlay -->
    <div id="video-overlay">
        <button onclick="closeVideo()" class="absolute top-6 right-6 text-white text-3xl hover:text-[#d4af37]">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="video-container">
            <iframe id="yt-player" width="100%" height="100%" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="video-info" class="mt-4 text-center px-4">
            <h3 id="playing-title" class="text-lg font-bold text-[#d4af37]">Title</h3>
            <p class="text-sm text-gray-400 mt-2">เล่นต่อเนื่องอัตโนมัติในหมวดหมู่นี้</p>
            <div class="mt-2 text-[10px] text-gray-500 uppercase tracking-widest">Powered by YouTube</div>
        </div>
    </div>

    <script>
        // กำหนด URL แยกกันระหว่างบุคคล และ ประวัติศาสตร์โลก
        const CSV_PERSONS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTx8wXxee_aJWZYdCWC97p3MCMHmWu47xK6SLQbpULd7a8zBxQm7uQbzSwIVB4meY6cWhJHkjRkAtMS/pub?output=csv";
        const CSV_WORLD_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnb7mJzl19itVoRpcwzoElYWPpftPBOnUwltYiTpLvAktND0X0tNSzMS1RJjgjZA05nYz_t8yXyfya/pub?output=csv"; // ใส่ URL ของประวัติศาสตร์โลกที่นี่
        
        let DATA_PERSONS = [];
        let DATA_WORLD = [];
        let CATEGORIES_PERSONS = {};
        let CATEGORIES_WORLD = {};

        let CURRENT_VIEW = 'all';
        let SEARCH_QUERY = '';
        let SELECTED_CATEGORY = null;
        let FAVORITES = JSON.parse(localStorage.getItem('fav_vids')) || [];

        async function init() {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            
            try {
                // โหลดข้อมูลทั้งสองแหล่งพร้อมกัน
                const [resPersons, resWorld] = await Promise.all([
                    fetch(CSV_PERSONS_URL + "&t=" + Date.now()),
                    fetch(CSV_WORLD_URL + "&t=" + Date.now())
                ]);

                const textPersons = await resPersons.text();
                const textWorld = await resWorld.text();

                DATA_PERSONS = parseCSV(textPersons);
                DATA_WORLD = parseCSV(textWorld);

                groupData();
                renderSidebar();
                render();
            } catch (err) {
                document.getElementById('loader-text').innerHTML = `<span class="text-red-500">ผิดพลาดในการโหลดข้อมูล</span>`;
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return [];

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const idxCategory = headers.indexOf('category');
            const idxTitle = headers.indexOf('title');
            const idxUrl = headers.indexOf('url');

            const results = [];
            for (let i = 1; i < lines.length; i++) {
                const cells = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cells.length > Math.max(idxCategory, idxTitle, idxUrl)) {
                    results.push({
                        category: (cells[idxCategory] || 'ทั่วไป').replace(/"/g, '').trim(),
                        title: (cells[idxTitle] || 'ไม่มีชื่อ').replace(/"/g, '').trim(),
                        url: (cells[idxUrl] || '').replace(/"/g, '').trim()
                    });
                }
            }
            return results;
        }

        function groupData() {
            CATEGORIES_PERSONS = {};
            DATA_PERSONS.forEach(item => {
                if (!item.url) return;
                if (!CATEGORIES_PERSONS[item.category]) CATEGORIES_PERSONS[item.category] = [];
                CATEGORIES_PERSONS[item.category].push(item);
            });

            CATEGORIES_WORLD = {};
            DATA_WORLD.forEach(item => {
                if (!item.url) return;
                if (!CATEGORIES_WORLD[item.category]) CATEGORIES_WORLD[item.category] = [];
                CATEGORIES_WORLD[item.category].push(item);
            });
        }

        function renderSidebar() {
            const histList = document.getElementById('hist-cat-list');
            const worldList = document.getElementById('world-cat-list');
            histList.innerHTML = '';
            worldList.innerHTML = '';

            // หมวดหมู่บุคคล
            Object.keys(CATEGORIES_PERSONS).sort().forEach(cat => {
                const btn = createCategoryBtn(cat);
                histList.appendChild(btn);
            });

            // หมวดหมู่โลก
            Object.keys(CATEGORIES_WORLD).sort().forEach(cat => {
                const btn = createCategoryBtn(cat);
                worldList.appendChild(btn);
            });
        }

        function createCategoryBtn(cat) {
            const btn = document.createElement('button');
            btn.className = "text-left py-2 px-3 hover:bg-[#d4af37]/10 hover:text-[#d4af37] rounded transition-all text-gray-400 border-l-2 border-transparent hover:border-[#d4af37]";
            btn.textContent = cat;
            btn.onclick = () => {
                SELECTED_CATEGORY = cat;
                SEARCH_QUERY = '';
                document.getElementById('search-input').value = '';
                toggleSidebar();
                render();
            };
            return btn;
        }

        function handleSearch() {
            SEARCH_QUERY = document.getElementById('search-input').value.trim().toLowerCase();
            SELECTED_CATEGORY = null; 
            render();
        }

        function render() {
            const wrapper = document.getElementById('sections-wrapper');
            const loader = document.getElementById('loader');
            const viewLabel = document.getElementById('view-label');
            loader.style.display = 'none';
            wrapper.innerHTML = '';

            updateNavUI();

            if (SEARCH_QUERY) {
                viewLabel.textContent = `ค้นหา: "${SEARCH_QUERY}"`;
            } else if (SELECTED_CATEGORY) {
                viewLabel.textContent = `หมวดหมู่: ${SELECTED_CATEGORY}`;
            } else {
                viewLabel.textContent = CURRENT_VIEW === 'all' ? 'หน้าแรก: ทั้งหมด' : `หน้าแรก: ${CURRENT_VIEW}`;
            }

            if (CURRENT_VIEW === 'favorite') {
                renderFavorites(wrapper);
                return;
            }

            // แยกการแสดงผลตาม View
            if (CURRENT_VIEW === 'all' || CURRENT_VIEW === 'บุคคล') {
                renderDataSet(wrapper, CATEGORIES_PERSONS, "บุคคลสำคัญ");
            }
            
            if (CURRENT_VIEW === 'all' || CURRENT_VIEW === 'โลก') {
                renderDataSet(wrapper, CATEGORIES_WORLD, "ประวัติศาสตร์โลก");
            }

            if (wrapper.innerHTML === '') {
                wrapper.innerHTML = `
                    <div class="text-center py-20 opacity-40">
                        <i class="fa-solid fa-magnifying-glass text-4xl mb-4"></i>
                        <p>ไม่พบข้อมูลวิดีโอที่ค้นหา</p>
                    </div>
                `;
            }
        }

        function renderDataSet(wrapper, categorizedData, mainTitle) {
            let foundInSet = false;
            const container = document.createElement('div');
            container.className = "space-y-6";
            
            const mainHeader = document.createElement('div');
            mainHeader.className = "px-2 py-4 border-b border-white/5 flex items-center gap-3";
            mainHeader.innerHTML = `<i class="fa-solid fa-folder-open text-[#d4af37]"></i> <h2 class="text-2xl font-bold font-[Cinzel] gold-gradient">${mainTitle}</h2>`;
            container.appendChild(mainHeader);

            Object.keys(categorizedData).forEach(catName => {
                let items = categorizedData[catName];

                if (SELECTED_CATEGORY && catName !== SELECTED_CATEGORY) return;

                if (SEARCH_QUERY) {
                    items = items.filter(it => 
                        it.title.toLowerCase().includes(SEARCH_QUERY) || 
                        it.category.toLowerCase().includes(SEARCH_QUERY)
                    );
                }

                if (items.length > 0) {
                    foundInSet = true;
                    const section = createSection(catName, items);
                    container.appendChild(section);
                }
            });

            if (foundInSet) {
                wrapper.appendChild(container);
            }
        }

        function createSection(title, items) {
            const section = document.createElement('section');
            section.className = "section-card-bg shadow-lg fade-in";
            
            const head = `
                <div class="flex justify-between items-end mb-4 px-4">
                    <div>
                        <h2 class="text-lg font-bold text-[#d4af37] border-l-4 border-[#d4af37] pl-3">${title}</h2>
                        <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">${items.length} วิดีโอ</p>
                    </div>
                </div>
            `;

            const slider = document.createElement('div');
            slider.className = "flex overflow-x-auto gap-4 no-scrollbar px-4 snap-x";
            
            items.forEach((item) => {
                const vidId = getYTId(item.url);
                if (!vidId) return;

                const card = document.createElement('div');
                card.className = "video-card snap-start shrink-0 group cursor-pointer";
                card.onclick = () => playVideo(item, items);
                
                const isFav = FAVORITES.some(f => f.url === item.url);

                card.innerHTML = `
                    <div class="relative aspect-video bg-black rounded-lg border border-[#d4af37]/20 overflow-hidden group-hover:border-[#d4af37] transition-all shadow-md">
                        <img src="https://img.youtube.com/vi/${vidId}/mqdefault.jpg" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/20">
                            <i class="fa-solid fa-play text-white text-2xl drop-shadow-lg opacity-0 group-hover:opacity-100 transform scale-50 group-hover:scale-100 transition-all"></i>
                        </div>
                        <button onclick="toggleFav(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-black/50 flex items-center justify-center text-white hover:text-red-500">
                            <i class="${isFav ? 'fa-solid fa-star text-yellow-500' : 'fa-regular fa-star'}"></i>
                        </button>
                    </div>
                    <h4 class="text-xs mt-2 font-medium line-clamp-2 leading-relaxed group-hover:text-[#d4af37] transition-colors px-1">${item.title}</h4>
                `;
                slider.appendChild(card);
            });

            section.innerHTML = head;
            section.appendChild(slider);
            return section;
        }

        function renderFavorites(container) {
            if (FAVORITES.length === 0) {
                container.innerHTML = `<div class="text-center py-20 opacity-40"><i class="fa-solid fa-star text-4xl mb-4"></i><p>ไม่มีรายการโปรด</p></div>`;
                return;
            }
            const section = createSection("วิดีโอที่คุณชื่นชอบ", FAVORITES);
            container.appendChild(section);
        }

        function playVideo(target, playlist) {
            const vidId = getYTId(target.url);
            const overlay = document.getElementById('video-overlay');
            const player = document.getElementById('yt-player');
            const title = document.getElementById('playing-title');

            const otherIds = playlist
                .map(item => getYTId(item.url))
                .filter(id => id && id !== vidId);
            
            const playlistParam = otherIds.length > 0 ? `&playlist=${otherIds.join(',')}` : '';
            
            player.src = `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1${playlistParam}`;
            title.textContent = target.title;
            overlay.classList.add('active');
        }

        function closeVideo() {
            const overlay = document.getElementById('video-overlay');
            const player = document.getElementById('yt-player');
            player.src = "";
            overlay.classList.remove('active');
        }

        function getYTId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function toggleFav(e, item) {
            e.stopPropagation();
            const idx = FAVORITES.findIndex(f => f.url === item.url);
            if (idx > -1) FAVORITES.splice(idx, 1);
            else FAVORITES.push(item);
            
            localStorage.setItem('fav_vids', JSON.stringify(FAVORITES));
            render();
        }

        function changeView(view) {
            CURRENT_VIEW = view;
            SELECTED_CATEGORY = null;
            SEARCH_QUERY = '';
            document.getElementById('search-input').value = '';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateNavUI() {
            document.getElementById('nav-all').classList.toggle('active-nav', CURRENT_VIEW === 'all');
            document.getElementById('nav-history').classList.toggle('active-nav', CURRENT_VIEW === 'บุคคล');
            document.getElementById('nav-world').classList.toggle('active-nav', CURRENT_VIEW === 'โลก');
            document.getElementById('nav-fav').classList.toggle('active-nav', CURRENT_VIEW === 'favorite');
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sb.classList.toggle('sidebar-closed');
            overlay.classList.toggle('hidden');
        }

        function toggleCollapse(id) {
            const menu = document.getElementById(id);
            const iconId = id.includes('hist') ? 'hist-icon' : 'world-icon';
            const icon = document.getElementById(iconId);
            
            if (menu.style.maxHeight === '0px' || menu.style.maxHeight === '') {
                menu.style.maxHeight = '2000px';
                icon.classList.replace('fa-chevron-right', 'fa-chevron-down');
            } else {
                menu.style.maxHeight = '0px';
                icon.classList.replace('fa-chevron-down', 'fa-chevron-right');
            }
        }

        init();
    </script>
</body>
</html>
